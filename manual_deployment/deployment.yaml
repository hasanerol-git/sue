apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-demo
  namespace: manual-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-demo
  template:
    metadata:
      labels:
        app: node-demo
    spec:
      containers:
        - name: node
          image: node:18-bullseye
          command: ["sleep", "infinity"]
