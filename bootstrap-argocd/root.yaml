apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://repourl	#CHANGE
    targetRevision: main
    path: gitops/subfolder	#CHANGE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
